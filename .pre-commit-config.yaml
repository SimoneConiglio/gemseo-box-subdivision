# `contrib/` holds artifacts of another project, verbatim: patches that must
# apply with `git am`, and issue and merge-request bodies that are pasted into
# its tracker. Stamping this project's licence headers onto them would put the
# wrong copyright upstream and show up in the tickets, and trimming whitespace
# or fixing the end of a `.patch` corrupts the patch itself. They are formatted
# by, and checked against, the project they are going to.
exclude: ^contrib/

repos:

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
    - id: trailing-whitespace
      # The figures are generated, and matplotlib pads its SVG lines.
      exclude: ^docs/_static/figures/
    - id: end-of-file-fixer
      exclude: LICENSES/headers|^docs/_static/figures/
    - id: check-yaml
      # !! prefix is specific to mkdocs
      exclude: mkdocs.yml
    - id: check-added-large-files
    - id: check-json
    - id: pretty-format-json
      args: [
        --autofix,
        --no-sort-keys,
      ]
      exclude: \.ipynb
    - id: check-toml
    - id: destroyed-symlinks
    - id: check-symlinks

- repo: https://github.com/pre-commit/pygrep-hooks
  rev: v1.10.0
  hooks:
    - id: rst-backticks
    - id: rst-directive-colons
    - id: rst-inline-touching-normal

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.16.7
  hooks:
    - id: ruff-check
      types_or: [ python, pyi, jupyter ]
      args: [ --exit-non-zero-on-fix ]
    - id: ruff-format
      types_or: [ python, pyi, jupyter ]

- repo: https://github.com/rhysd/actionlint
  rev: v1.7.12
  hooks:
    - id: actionlint

- repo: https://github.com/commitizen-tools/commitizen
  rev: v4.9.1
  hooks:
    - id: commitizen
      stages: [commit-msg]

- repo: https://github.com/kynan/nbstripout
  rev: 0.8.1
  hooks:
    - id: nbstripout

- repo: https://github.com/igorshubovych/markdownlint-cli
  rev: v0.45.0
  hooks:
  - id: markdownlint
    args: [
      --fix,
      --disable,
      MD024,
      ]

- repo: https://github.com/Lucas-C/pre-commit-hooks
  rev: v1.5.5
  hooks:
    - id: insert-license
      name: insert LGPL license
      exclude: ^docs
      files: \.py$
      args:
        - --license-filepath
        - LICENSES/headers/LGPL-3.0.txt
    - id: insert-license
      name: insert BSD license
      files: ^docs/(examples|tutorials).*\.py$
      args:
        - --license-filepath
        - LICENSES/headers/BSD-0-Clause.txt
    - id: insert-license
      name: insert CC BY-SA license for rst files
      files: \.rst$
      args:
        - --license-filepath
        - LICENSES/headers/CC-BY-SA-4.0.txt
        - --comment-style
        - ..|   |
    - id: insert-license
      name: insert CC BY-SA license for md files
      files: \.md$
      args:
        - --license-filepath
        - LICENSES/headers/CC-BY-SA-4.0.txt
        - --comment-style
        - <!--||-->
