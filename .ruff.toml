[lint.isort]
force-single-line = true
required-imports = ["from __future__ import annotations"]

[lint.pydocstyle]
convention = "google"

[lint.per-file-ignores]
"*.ipynb" = ["unnecessary-assign"]
# The benchmarks report their measurements on the standard output, and a measured
# value that happens to fall near pi or tau is a measurement, not a constant.
"benchmarks/**/*.py" = ["T", "math-constant"]
"tests/*.py" = ["D", "pytest-unittest-assertion", "pytest-raises-too-broad", "pytest-unittest-raises-assertion", "PTH"]
"docs/*.py" = [
  "T",
  "D",
  # The figures embed measured results; a gap of 3.142 is not pi.
  "math-constant",
  "useless-expression",
  "PTH",
  "line-too-long",
  "PERF",
  "builtin-variable-shadowing",
  "unnecessary-assign",
  "implicit-namespace-package",
]

[format]
docstring-code-format = true
docstring-code-line-length = 75
