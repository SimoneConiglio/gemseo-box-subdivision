[project]
name = "gemseo-box-subdivision"
authors = [
    {name = "Simone Coniglio", email = "simone.coniglio91@gmail.com"}
]
description = "Box-subdivision outer approximation, a GEMSEO plugin for multimodal problems"
readme = "README.md"
license = "LGPL-3.0"
license-files = ["LICENSE.txt"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dynamic = ["version"]
requires-python = ">=3.10, <3.14"
dependencies = [
    "gemseo[all] >=6.3,<7",
    "gemseo-bilevel-outer-approximation >=0.1.1",
]

[dependency-groups]
# The benchmarking harness is only needed to run the algorithm comparisons,
# not to use the algorithms, hence a dedicated group.
benchmark = [
    # CMA-ES, one of the baselines; DIRECT comes with SciPy.
    "cma >=4,<5",
    # SEGO, the Bayesian-optimization baseline.
    "egobox >=0.37,<1",
    "gemseo-benchmark >=4,<5",
]
dev = [
    "covdefaults >=2",
    "pytest >=7,<9",
    "pytest-cov >=5",
    "pytest-xdist >=3",
]
doc = [
    "myst-parser",
    "pydata-sphinx-theme >=0.16",
    "sphinx >=7",
    "sphinx-copybutton",
    "sphinx-design",
    # Ships MathJax, so that the equations do not depend on a CDN at view time.
    "sphinx-mathjax-offline",
]

[project.urls]
Homepage = "https://github.com/SimoneConiglio/gemseo-box-subdivision"
Source = "https://github.com/SimoneConiglio/gemseo-box-subdivision"
Issues = "https://github.com/SimoneConiglio/gemseo-box-subdivision/issues"

[project.entry-points]
gemseo_plugins = { gemseo-box-subdivision = "gemseo_box_subdivision" }

[build-system]
requires = [
    "setuptools",
    "setuptools_scm[toml]",
]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
# A build off a tag is exactly that tag; a build between tags is a plain dev
# version. The default appends the commit as a PEP 440 local segment, which both
# PyPI and TestPyPI reject, so an untagged rehearsal could never be uploaded.
local_scheme = "no-local-version"
