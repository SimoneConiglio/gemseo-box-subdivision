name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required by configure-pages to switch the source to GitHub Actions.
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools_scm derives the version from the tags.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install tox
        run: python -m pip install --upgrade pip tox tox-uv
      - name: Configure GitHub Pages
        # enablement switches the source of the pages to GitHub Actions, so that
        # the built documentation is published instead of the repository being
        # processed by Jekyll.
        uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true
      - name: Build the documentation
        run: tox -e doc
        env:
          # The inventories are reachable from the runner.
          SPHINX_INTERSPHINX: "1"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html
      # The Pages artifact above is a tarball only the deployment can read, and
      # the deployment runs on the default branch alone, so a change to the
      # documentation was reviewable only once merged. This one is a plain
      # archive: download it from the run and open index.html.
      - name: Upload the documentation to browse
        uses: actions/upload-artifact@v4
        with:
          name: documentation-${{ github.event.pull_request.number || github.sha }}
          path: docs/_build/html
          retention-days: 14

  deploy:
    name: Deploy to GitHub Pages
    # Only the default branch is published.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
